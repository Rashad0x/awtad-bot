name: Awtad Cloud Scheduler

on:
  schedule:
    - cron: '*/5 * * * *' # بيشتغل أوتوماتيك كل 5 دقائق

jobs:
  run-bot:
  runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir requests openpyxl

      - name: Run Bot Script
        run: |
          python bot.py
